<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: rgba(255,255,255,0.2);
            padding: 30px;
            border-radius: 15px;
            color: white;
            width: 320px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: none;
        }

        button {
            background: #ff7eb3;
            border: none;
            padding: 10px;
            color: white;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
        }

        .error {
            background: #ef4444;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Create Account</h2>

    <!-- Error message -->
    <div id="errorBox"></div>

    <form action="customer.php" method="POST">
        <input type="text" id="username" name="username" placeholder="Username" required>

        <input type="text" id="location" name="location" placeholder="Location" required>

        <!-- PASSWORDS stay EMPTY -->
        <input type="password" name="password" placeholder="Password" required>

        <input type="password" name="confirm_password" placeholder="Confirm Password" required>

        <button type="submit">Register</button>
    </form>
</div>

<script>
    const params = new URLSearchParams(window.location.search);

    // Autofill username & location
    document.getElementById("username").value = params.get("username") || "";
    document.getElementById("location").value = params.get("location") || "";

    // Show error message
    const error = params.get("error");
    const errorBox = document.getElementById("errorBox");

    if (error === "userexists") {
        errorBox.innerHTML = "<div class='error'>Username already exists.</div>";
    } else if (error === "passmismatch") {
        errorBox.innerHTML = "<div class='error'>Passwords do not match.</div>";
    }
</script>

</body>
</html>
